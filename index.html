<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Do you love me?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='%239d2744'/%3E%3C/svg%3E">
<!--
  Names, without editing this file:
  index.html?to=Aarohi&from=Aditya&q=Will%20you%20be%20mine
  Or change the defaults in GIFT at the bottom.
-->
<style>
  :root {
    --ink: #2c2226;
    --rose: #9d2744;
    --blush: #f6d5dc;
    --paper: #fffaf7;
    --line: #f0d5d6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 420px at 50% -10%, #fff 0%, transparent 55%),
      linear-gradient(180deg, #f8e8eb 0%, #f3d4dc 48%, #edd9cf 100%);
    padding: 24px 16px;
  }
  .float {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .float i {
    position: absolute;
    font-style: normal;
    color: #c4526a;
    opacity: .35;
    animation: drift 8s ease-in-out infinite;
  }
  .float i:nth-child(1) { left: 8%; top: 18%; font-size: 18px; }
  .float i:nth-child(2) { left: 86%; top: 14%; font-size: 14px; animation-delay: -2s; }
  .float i:nth-child(3) { left: 12%; top: 74%; font-size: 12px; animation-delay: -4s; }
  .float i:nth-child(4) { left: 80%; top: 70%; font-size: 20px; animation-delay: -1s; }
  .float i:nth-child(5) { left: 48%; top: 8%; font-size: 11px; animation-delay: -3s; }
  @keyframes drift {
    50% { transform: translateY(-10px); }
  }
  .card {
    width: min(440px, 100%);
    min-height: 480px;
    background: var(--paper);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(90, 30, 45, .14);
    padding: 36px 28px 28px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--line);
    border-radius: 20px;
    pointer-events: none;
  }
  .eyebrow, .script, .taunt, .from, .again {
    font-family: "Segoe Script", "Bradley Hand ITC", cursive;
  }
  .eyebrow {
    margin: 0;
    text-align: center;
    color: var(--rose);
    font-size: 22px;
  }
  h1 {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 500;
    font-size: clamp(40px, 8vw, 62px);
    letter-spacing: -0.03em;
    line-height: .95;
    text-align: center;
    margin: 18px 0 8px;
    text-wrap: balance;
  }
  .script, .taunt {
    display: block;
    text-align: center;
    color: #8a5c66;
    font-size: 18px;
  }
  .screen { position: relative; z-index: 1; }
  .envelope {
    display: block;
    width: 196px;
    height: 132px;
    margin: 26px auto 6px;
    position: relative;
    perspective: 700px;
  }
  .pocket, .flap {
    position: absolute;
    left: 0;
    right: 0;
  }
  .pocket {
    top: 36px;
    bottom: 0;
    background: #fff5f4;
    border: 1px solid #e7c4c8;
    border-radius: 4px 4px 14px 14px;
    box-shadow: 0 12px 24px rgba(90, 30, 45, .08);
  }
  .pocket::before, .pocket::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 50%;
    height: 72%;
    background: linear-gradient(#fff, #fdecef);
  }
  .pocket::before { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }
  .pocket::after { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  .flap {
    top: 0;
    height: 86px;
    background: linear-gradient(#fffdfb, #f4c2cc);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .32s ease;
    z-index: 2;
    filter: drop-shadow(0 1px 0 #e7c4c8);
  }
  .envelope.is-open .flap { transform: rotateX(188deg); }
  .wax {
    position: absolute;
    left: 50%;
    top: 58px;
    z-index: 3;
    width: 42px;
    height: 42px;
    margin-left: -21px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 35%, #d85a73, #9d2744 62%);
    color: #fff;
    font-size: 18px;
    box-shadow: 0 4px 0 #7a2036;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    touch-action: manipulation;
  }
  button:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }
  .open {
    display: block;
    width: 100%;
    background: transparent;
    color: var(--rose);
    padding: 0;
  }
  .open-label {
    display: block;
    margin: 8px auto 0;
    width: fit-content;
    background: var(--rose);
    color: #fff;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 15px;
    letter-spacing: .04em;
  }
  .arena {
    position: relative;
    height: 210px;
    margin-top: 12px;
  }
  .yes, .no {
    position: absolute;
    top: 50%;
    border-radius: 999px;
    min-width: 108px;
    padding: 14px 22px;
    font-size: 16px;
    letter-spacing: .08em;
    transform: translateY(-50%);
  }
  .yes {
    left: calc(50% - 124px);
    background: var(--rose);
    color: #fff;
  }
  .no {
    left: calc(50% + 16px);
    background: #fff;
    color: var(--rose);
    border: 1.5px solid var(--rose);
    transition: transform .09s linear;
    z-index: 2;
  }
  .taunt { min-height: 1.4em; margin-top: 4px; }
  #seal, #done {
    min-height: 408px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #done { text-align: center; }
  #done h1 { margin-top: 8px; }
  .from { color: var(--rose); font-size: 20px; }
  .letter {
    margin: 18px auto 0;
    max-width: 32ch;
    text-align: left;
    line-height: 1.45;
    font-family: Palatino, Georgia, serif;
    font-size: 18px;
  }
  .again {
    display: inline-block;
    margin-top: 22px;
    background: transparent;
    color: var(--rose);
    font-size: 18px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  #burst {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .spark {
    position: absolute;
    left: 50%;
    top: 22%;
    font-style: normal;
    color: var(--rose);
    font-size: 16px;
    animation: pop .7s ease-out forwards;
  }
  @keyframes pop {
    to { transform: translate(var(--x), var(--y)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .float i, .spark, .flap, .no { animation: none; transition: none; }
  }
</style>
</head>
<body>
  <div class="float" aria-hidden="true"><i>♥</i><i>♥</i><i>♥</i><i>♥</i><i>♥</i></div>
  <main class="card">
    <div id="burst"></div>
    <section class="screen" id="seal">
      <p class="eyebrow" id="for"></p>
      <button class="open" id="open" type="button">
        <span class="envelope" id="env" aria-hidden="true">
          <span class="flap"></span>
          <span class="pocket"></span>
          <span class="wax">♥</span>
        </span>
        <span class="open-label">Open</span>
      </button>
      <span class="script">open when you are ready.</span>
    </section>
    <section class="screen" id="ask" hidden>
      <p class="eyebrow" id="ask-for"></p>
      <h1 id="question"></h1>
      <div class="arena" id="arena">
        <button class="yes" id="yes" type="button">YES</button>
        <button class="no" id="no" type="button">NO</button>
      </div>
      <span class="taunt" id="taunt" aria-live="polite">one of them keeps moving.</span>
    </section>
    <section class="screen" id="done" hidden>
      <p class="from" id="from-line"></p>
      <h1>Yes.</h1>
      <span class="script">i love you too.</span>
      <p class="letter" id="letter"></p>
      <button class="again" id="again" type="button">once more</button>
    </section>
  </main>
<script>
const params = new URLSearchParams(location.search);
const GIFT = {
  to: params.get("to") || "you",
  from: params.get("from") || "me",
  question: params.get("q") || "Do you love me?",
  letter: params.get("letter") || "You found the button that stays. I love you. That is the whole note."
};

const LINES = [
  "too slow.",
  "that one will not sit still.",
  "the pink button is easier.",
  "still no.",
  "you can do this all day. it will not."
];

const forLine = GIFT.to === "you" ? "a note for you" : "for " + GIFT.to;
document.getElementById("for").textContent = forLine;
document.getElementById("ask-for").textContent = forLine;
document.getElementById("question").textContent = GIFT.question;
document.getElementById("letter").textContent = GIFT.letter;
document.getElementById("from-line").textContent = "from " + GIFT.from;
if (GIFT.to !== "you") document.title = "For " + GIFT.to;

const seal = document.getElementById("seal");
const ask = document.getElementById("ask");
const done = document.getElementById("done");
const env = document.getElementById("env");
const no = document.getElementById("no");
const arena = document.getElementById("arena");
const taunt = document.getElementById("taunt");
const burst = document.getElementById("burst");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let dodges = 0;
let placed = false;

function show(which) {
  seal.hidden = which !== seal;
  ask.hidden = which !== ask;
  done.hidden = which !== done;
  if (which === ask) requestAnimationFrame(() => requestAnimationFrame(placeNo));
}

function placeNo() {
  const box = arena.getBoundingClientRect();
  const yes = document.getElementById("yes");
  const gap = 16;
  const total = yes.offsetWidth + gap + no.offsetWidth;
  const x = Math.max(8, (box.width - total) / 2 + yes.offsetWidth + gap);
  const y = (box.height - no.offsetHeight) / 2;
  yes.style.left = Math.max(8, (box.width - total) / 2) + "px";
  yes.style.top = y + "px";
  yes.style.transform = "none";
  no.style.left = "0px";
  no.style.top = "0px";
  no.style.transition = "none";
  no.style.transform = "translate3d(" + x + "px," + y + "px,0)";
  placed = true;
  requestAnimationFrame(() => { no.style.transition = ""; });
}

function dodge(event) {
  if (!placed) return;
  event.preventDefault();
  const box = arena.getBoundingClientRect();
  const btn = no.getBoundingClientRect();
  const yes = document.getElementById("yes").getBoundingClientRect();
  let x = 0;
  let y = 0;
  for (let i = 0; i < 8; i++) {
    x = 6 + Math.random() * Math.max(8, box.width - btn.width - 12);
    y = 6 + Math.random() * Math.max(8, box.height - btn.height - 12);
    const left = box.left + x;
    const top = box.top + y;
    const clear = left + btn.width < yes.left - 8 || left > yes.right + 8 || top + btn.height < yes.top - 8 || top > yes.bottom + 8;
    const far = Math.hypot(left - btn.left, top - btn.top) > 64;
    if (clear && far) break;
  }
  no.style.transform = "translate3d(" + x + "px," + y + "px,0)";
  dodges += 1;
  taunt.textContent = LINES[Math.min(dodges - 1, LINES.length - 1)];
}

function celebrate() {
  burst.replaceChildren();
  if (reduce) return;
  for (let i = 0; i < 12; i++) {
    const spark = document.createElement("i");
    spark.className = "spark";
    spark.textContent = "♥";
    const angle = Math.PI * (1 + i / 11);
    const dist = 86 + (i % 3) * 34;
    spark.style.setProperty("--x", Math.cos(angle) * dist + "px");
    spark.style.setProperty("--y", Math.sin(angle) * dist + "px");
    burst.appendChild(spark);
  }
}

document.getElementById("open").addEventListener("click", () => {
  env.classList.add("is-open");
  const wait = reduce ? 0 : 280;
  setTimeout(() => show(ask), wait);
});

no.addEventListener("pointerenter", dodge);
no.addEventListener("pointerdown", dodge);
no.addEventListener("focus", dodge);

document.getElementById("yes").addEventListener("click", () => {
  celebrate();
  show(done);
});

document.getElementById("again").addEventListener("click", () => {
  dodges = 0;
  taunt.textContent = "one of them keeps moving.";
  env.classList.remove("is-open");
  burst.replaceChildren();
  show(seal);
});
</script>
</body>
</html>
